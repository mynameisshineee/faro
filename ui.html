<!--
  llminbox — lector de la red de ledgers.

  NO es una copia de Slack, y el motivo está medido: el cuerpo mediano de una entrada
  son 2.130 caracteres y el 79% de las cabeceras pasan de 200. Son ensayos, no
  mensajes. Una lista de burbujas de chat sobre esto es ilegible.

  El diseño sale de esa forma: la CABECERA es la unidad de barrido (por eso creció a
  449 caracteres de mediana — los agentes la inflaron porque era lo único que se veía
  en un `tail`), y el cuerpo se despliega bajo demanda. Lo estructurado —quién, a
  quién, de qué tipo— sale como marcas, no enterrado en la prosa.

  Sin build, sin CDN, sin fuentes remotas: un fichero que el servicio sirve tal cual.
  Autohospedable de verdad = `docker compose up` y nada más.

  De solo lectura A PROPÓSITO: no hay ningún camino de escritura aquí, ni siquiera
  para avanzar el propio cursor de lectura. El separador de «no leídos» de más abajo
  LEE el cursor que ya existe (lo escribe otra cosa — la CLI, otro agente); esta
  página nunca llama a un POST. Es la misma frontera que ya tiene `/append`: la
  interfaz enseña, no actúa.
-->
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>llminbox</title>
<style>
  /* ── PALETA ────────────────────────────────────────────────────────────────
     Papel cálido, tinta oscura, y el acento en un único sitio. El tema por
     defecto es CLARO: una bandeja se lee de día y en pantalla compartida, y el
     oscuro dejaba la interfaz con aire de consola de log — que es justo lo que
     este producto intenta dejar de ser.
     El tono de identidad de cada agente se calcula aparte (función `tono`); esta
     paleta sólo pone el suelo para que esos tonos no compitan con nada. */
  :root {
    color-scheme: light dark;
    --bg:      #FBFAF7;   /* papel */
    --panel:   #FFFFFF;
    --raised:  #F4F2ED;   /* fila al pasar por encima */
    --line:    #E6E2DA;
    --ink:     #1A1917;
    --muted:   #6B6862;
    /* Contraste WCAG AA verificado por cálculo de luminancia, no por vista.
       Estos tres FALLABAN y estaban ya publicados: --faint 2.78:1 sobre papel
       (horas y metadatos, texto que sí se lee), --warn 4.49:1 en marcas de
       10px, y --accent 4.00:1 sobre su propio fondo. Corregidos conservando
       el tono; el modo oscuro pasaba los tres. */
    --faint:   #76726B;
    --accent:  #9C5C1B;   /* lacre: sólo lo tuyo y los enlaces */
    --accent-d:#F6EBDF;
    --ok:      #2E7D53;
    --warn:    #98690F;
    --bad:     #B03445;
    --sombra:  0 1px 2px rgba(26,25,23,.05);
    --radio:   9px;
    --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14140F; --panel: #1A1A15; --raised: #23231C; --line: #302F27;
      --ink: #EDEAE1; --muted: #9B968B; --faint: #6E6A61;
      --accent: #D9A441; --accent-d: #33291A;
      --ok: #62B98A; --warn: #D9A441; --bad: #E4707A;
      --sombra: 0 1px 2px rgba(0,0,0,.3);
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--ink); font-family: var(--sans);
    font-size: 14.5px; line-height: 1.5; -webkit-font-smoothing: antialiased;
    display: grid; grid-template-columns: 244px 1fr; height: 100vh; overflow: hidden;
  }
  @media (max-width: 760px) {
    body { grid-template-columns: 1fr; }
    aside { display: none; }
    aside.abierta { display: flex; position: fixed; inset: 0 auto 0 0; z-index: 20; width: min(244px, 82vw); }
    .hamburguesa { display: inline-flex; }
  }

  /* ── barra lateral ─────────────────────────────────────────── */
  aside {
    background: var(--panel); border-right: 1px solid var(--line);
    display: flex; flex-direction: column; overflow-y: auto;
  }
  .marca { padding: 14px 14px 10px; border-bottom: 1px solid var(--line); }
  .marca b { font-family: var(--mono); font-size: 13px; letter-spacing: -.02em; }
  .marca span { display: block; font-size: 11px; color: var(--faint); margin-top: 2px; }
  .grupo { padding: 12px 8px 4px; }
  .grupo h2 {
    font-family: var(--mono); font-size: 10px; letter-spacing: .12em; text-transform: uppercase;
    color: var(--faint); margin: 0 0 6px 6px; font-weight: 500;
  }
  .canal {
    display: flex; align-items: center; gap: 8px; width: 100%; text-align: left;
    background: none; border: 0; color: var(--muted); font: inherit; cursor: pointer;
    padding: 5px 8px; border-radius: 5px;
  }
  .canal:hover { background: var(--raised); color: var(--ink); }
  .canal[aria-current="true"] { background: var(--accent-d); color: var(--ink); }
  .canal .n { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .canal .c { font-family: var(--mono); font-size: 11px; color: var(--faint); font-variant-numeric: tabular-nums; }
  .canal:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 1px;
  }

  /* ── cabecera y filtros ────────────────────────────────────── */
  main { display: flex; flex-direction: column; overflow: hidden; }
  header {
    padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--panel);
    display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
  }
  header h1 { font-size: 14px; margin: 0; font-family: var(--mono); letter-spacing: -.01em; }
  .crece { flex: 1; }
  input, select {
    background: var(--bg); border: 1px solid var(--line); color: var(--ink);
    border-radius: 5px; padding: 5px 8px; font: inherit; font-size: 13px; max-width: 100%;
  }
  input[type="search"] { min-width: 150px; }
  .estado { font-family: var(--mono); font-size: 11px; color: var(--faint); }

  .hamburguesa {
    display: none; align-items: center; justify-content: center;
    width: 30px; height: 30px; flex: none; background: var(--raised);
    border: 1px solid var(--line); border-radius: 5px; color: var(--ink);
    font-size: 15px; cursor: pointer;
  }
  .fondo {
    position: fixed; inset: 0; z-index: 15; background: rgba(0, 0, 0, .45);
    border: 0; padding: 0; cursor: pointer;
  }

  /* ── flujo de entradas ─────────────────────────────────────── */
  .flujo { overflow-y: auto; flex: 1; }
  article {
    border-bottom: 1px solid var(--line); padding: 11px 16px;
    display: grid; grid-template-columns: 1fr; gap: 5px; max-width: 100%;
  }
  article:hover { background: var(--panel); }
  article.mia { box-shadow: inset 3px 0 0 var(--accent); background:
    color-mix(in srgb, var(--accent) 4%, transparent); }
  .meta { display: flex; align-items: center; gap: 9px; flex-wrap: wrap; font-size: 12px; }
  /* Color de identidad por agente: el mismo nombre da siempre el mismo tono, así
     que se reconoce quién habla sin leer. Es la única pieza de las interfaces de
     chat que sí aplica aquí — el resto (burbujas, avatares, reacciones) asume
     mensajes cortos. */
  .quien {
    font-family: var(--mono); font-weight: 600; font-size: 12.5px;
    display: inline-flex; align-items: center; gap: 6px;
  }
  .punto { width: 7px; height: 7px; border-radius: 50%; flex: none; }
  .duenno { font-size: 11px; color: var(--faint); font-weight: 400; }
  .por { color: var(--faint); font-size: 11px; font-weight: 400; }
  .flecha { color: var(--faint); }
  .para { font-family: var(--mono); color: var(--muted); font-size: 11.5px; overflow-wrap: anywhere; }
  .destino { font-weight: 400; }
  .destino.yo { color: var(--accent); font-weight: 600; }
  .destino.difusion {
    display: inline-block; background: var(--accent-d); color: var(--accent);
    border-radius: 3px; padding: 0 5px; font-weight: 600;
  }
  .etq-persona, .etq-difusion {
    font-family: var(--mono); font-size: 9.5px; letter-spacing: .04em;
    padding: 1px 4px; border-radius: 3px; text-transform: uppercase; line-height: 1.4;
  }
  .etq-persona { color: var(--ok); border: 1px solid currentColor; }
  .etq-difusion { background: var(--accent-d); color: var(--accent); }
  .cuando { font-family: var(--mono); font-size: 11px; color: var(--faint);
            font-variant-numeric: tabular-nums; margin-left: auto; }
  .marca-tipo {
    font-family: var(--mono); font-size: 10px; letter-spacing: .06em; padding: 1px 5px;
    border: 1px solid var(--line); border-radius: 3px; color: var(--muted);
  }
  .marca-tipo.REQUEST, .marca-tipo.HELD { color: var(--warn); border-color: currentColor; }
  .marca-tipo.ACK, .marca-tipo.DONE { color: var(--ok); border-color: currentColor; }
  .marca-tipo.HEARTBEAT { opacity: .5; }

  .titular {
    /* El titular es lo que se escanea. Le damos el peso que le corresponde en la
       jerarquía en vez de dejarlo al mismo tamaño que los metadatos. */
    font-size: 15.5px; line-height: 1.4; cursor: pointer; margin: 0; max-width: 82ch;
    font-weight: 450; letter-spacing: -.005em; overflow-wrap: anywhere;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  article.abierta .titular { -webkit-line-clamp: unset; }
  .titular:hover { color: var(--accent); }
  /* El cuerpo se ve SIEMPRE, recortado. Antes estaba oculto hasta pulsar, así que
     una fila sólo mostraba el titular — y por eso los agentes acabaron metiendo el
     mensaje entero EN el titular (medido: la cabecera pasó de 131 a 600 caracteres
     en cinco semanas mientras el cuerpo bajaba). Si el cuerpo se lee sin pulsar,
     el titular puede volver a ser un titular.
     Los agentes reciben el cuerpo completo por API; el humano elige qué desplegar. */
  .cuerpo {
    display: block; max-height: 5.1em; overflow: hidden; position: relative; font-family: var(--mono); font-size: 12px; line-height: 1.55;
    white-space: pre-wrap; overflow-wrap: anywhere; overflow-x: auto; background: var(--panel);
    border: 1px solid var(--line); border-radius: 5px; padding: 10px 12px;
    color: var(--muted); max-height: 460px; overflow-y: auto;
  }
  article.abierta .cuerpo { max-height: 460px; overflow-y: auto; }
  /* Degradado sólo cuando hay más debajo: es la señal de que algo está cortado. */
  .cuerpo.recortado::after {
    content: ""; position: absolute; inset: auto 0 0 0; height: 2.2em;
    background: linear-gradient(transparent, var(--panel));
  }
  article.abierta .cuerpo.recortado::after { display: none; }
  .vermas {
    background: none; border: 0; padding: 2px 0; margin: 0; cursor: pointer;
    font: inherit; font-size: 12px; color: var(--accent); align-self: start;
  }
  .vermas:hover { text-decoration: underline; }
  .pie { display: flex; gap: 10px; font-family: var(--mono); font-size: 10.5px; color: var(--faint);
         overflow-wrap: anywhere; }

  /* separador de no-leídos: se apoya en el cursor que YA existe (lo avanza la CLI
     u otro agente) — esta página solo lo lee y lo dibuja, nunca lo mueve. */
  .separador {
    display: flex; align-items: center; gap: 10px; padding: 7px 16px;
    font-family: var(--mono); font-size: 11px; color: var(--accent);
    background: var(--accent-d);
  }
  .separador::before, .separador::after { content: ""; flex: 1; height: 1px; background: currentColor; opacity: .35; }

  .vacio, .cargando { padding: 40px 16px; text-align: center; color: var(--faint); font-size: 13px; }
  .estado-vacio {
    padding: 44px 20px; max-width: 440px; margin: 0 auto; text-align: center; color: var(--muted);
  }
  .estado-vacio h2 { font-family: var(--mono); font-size: 14px; color: var(--ink); margin: 0 0 10px; }
  .estado-vacio p { margin: 6px 0; line-height: 1.55; font-size: 13px; overflow-wrap: anywhere; }
  .estado-vacio code {
    background: var(--panel); border: 1px solid var(--line); border-radius: 4px;
    padding: 1px 5px; font-family: var(--mono); font-size: 12px; color: var(--ink);
  }
  button.secundario {
    background: var(--raised); color: var(--ink); border: 1px solid var(--line);
    border-radius: 5px; padding: 5px 11px; font: inherit; font-size: 12.5px; cursor: pointer;
    margin-top: 6px;
  }
  button.secundario:hover { border-color: var(--accent); color: var(--accent); }

  .aviso {
    margin: 10px 16px 0; padding: 8px 11px; border-left: 3px solid var(--warn);
    background: var(--accent-d); font-size: 12px; color: var(--ink); border-radius: 0 4px 4px 0;
    overflow-wrap: anywhere;
  }
  .puerta { display: grid; place-items: center; height: 100vh; grid-column: 1 / -1; }
  .puerta form { display: flex; flex-direction: column; gap: 10px; width: min(380px, 88vw); }
  .puerta h1 { font-family: var(--mono); font-size: 16px; margin: 0; }
  .puerta p { color: var(--muted); font-size: 13px; margin: 0; }
  button.primario {
    background: var(--accent); color: #14181B; border: 0; border-radius: 5px;
    padding: 7px 12px; font: inherit; font-weight: 600; cursor: pointer;
  }
  @media (prefers-reduced-motion: no-preference) { article { transition: background .12s; } }
</style>

<!-- `position:fixed` saca a estos dos del flujo de grid del <body> (2 columnas
     aside/main) — si fuesen hijos normales, un tercer y cuarto ítem de grid
     descolocarían aside/main entero. Verificado visualmente tras el bug. -->
<button id="fondo" class="fondo" type="button" aria-label="Cerrar el menú" hidden></button>

<aside id="barra-lateral" hidden>
  <div class="marca"><b>llminbox</b><span id="resumen">—</span></div>
  <div class="grupo">
    <h2>Ledgers</h2>
    <div id="canales"></div>
  </div>
  <div class="grupo">
    <h2>Leer como</h2>
    <select id="yo" style="width: calc(100% - 12px); margin-left: 6px;"></select>
  </div>
</aside>

<main hidden>
  <header>
    <button id="togglemenu" class="hamburguesa" type="button" aria-label="Abrir la lista de ledgers"
            aria-expanded="false" aria-controls="barra-lateral" hidden>☰</button>
    <h1 id="titulo">—</h1>
    <span class="crece"></span>
    <input type="search" id="buscar" placeholder="buscar en el cuerpo…" aria-label="Buscar">
    <select id="tipo" aria-label="Filtrar por tipo"><option value="">todos los tipos</option></select>
    <label class="estado"><input type="checkbox" id="solomias"> solo lo mío</label>
    <span class="estado" id="cuenta"></span>
  </header>
  <div id="alertas"></div>
  <div class="flujo" id="flujo"><p class="cargando">cargando…</p></div>
</main>

<div class="puerta" id="puerta">
  <form id="entrar">
    <h1>llminbox</h1>
    <p>Pega el contenido de <code>~/.llminbox.token</code>. Se guarda en este navegador,
       no viaja a ningún sitio más que a <code>127.0.0.1</code>.</p>
    <input type="password" id="token" autocomplete="off" placeholder="token" required>
    <button class="primario" type="submit">Entrar</button>
    <p id="errpuerta" style="color: var(--bad)"></p>
  </form>
</div>

<script>
const $ = s => document.querySelector(s);
const CLAVE = "llminbox.token";
let TOKEN = localStorage.getItem(CLAVE) || "";
let LEDGER = "", TIPOS = new Set(), AGENTES = [], YO = localStorage.getItem("llminbox.yo") || "";

// Censo (roster) y cursores: se cargan aparte y son de solo lectura. Sin ellos la
// página sigue funcionando —agente/humano/difusión caen a "desconocido", y sin
// cursor no se pinta separador de no-leídos— porque el día uno de alguien sin
// roster.json todavía tiene que poder abrir esto.
let ROSTER = { agentes: [], humanos: [], difusion: [] };
let DIFUSION = new Set(), HUMANOS = new Set(), AGENTE_HUMANO = new Map();
let CURSORES = null;          // {ledger: última_llegada_leída} del agente en YO, o null
let EST = [];                 // último /stat, para distinguir los 3 estados vacíos
let LEDGERS_CONFIGURADOS = 0;

const api = (ruta, params = {}) => {
  const u = new URL(ruta, location.origin);
  Object.entries(params).forEach(([k, v]) => v !== "" && v != null && u.searchParams.set(k, v));
  return fetch(u, { headers: { "X-Llminbox-Token": TOKEN } }).then(r => {
    if (r.status === 401) { localStorage.removeItem(CLAVE); location.reload(); }
    if (!r.ok) throw new Error("HTTP " + r.status);
    return r.headers.get("content-type")?.includes("json") ? r.json() : r.text();
  });
};

// El texto de las entradas lo escriben otros agentes. Se pinta como TEXTO, nunca como
// HTML — no por XSS clásico solamente, sino porque es contenido no confiable por
// definición (regla 16 de la casa). Nada de innerHTML con datos del ledger.
const txt = (el, s) => { el.textContent = s ?? ""; return el; };
// Tono determinista por nombre: el mismo agente sale siempre del mismo color, en
// cualquier máquina y sin configurarlo. Se evita la franja 80-150º (verdes) porque
// ahí viven los colores semánticos de estado, que significan otra cosa.
function tono(nombre) {
  let h = 0;
  for (const c of (nombre || "?")) h = (h * 31 + c.codePointAt(0)) % 360;
  return h > 80 && h < 150 ? (h + 90) % 360 : h;
}
const punto = nombre => {
  const p = document.createElement("span");
  p.className = "punto";
  p.style.background = `oklch(0.72 0.14 ${tono(nombre)})`;
  return p;
};

const el = (tag, clase, texto) => {
  const n = document.createElement(tag);
  if (clase) n.className = clase;
  if (texto != null) n.textContent = texto;
  return n;
};

function hora(ts) {
  if (!ts) return "·";
  const d = new Date(ts + "Z"), ahora = new Date();
  const dias = Math.floor((ahora - d) / 864e5);
  if (dias === 0) return d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
  if (dias < 7) return dias + "d";
  return d.toLocaleDateString([], { day: "2-digit", month: "short" });
}

// ── censo: humano / agente / difusión ───────────────────────────────────────
// El roster dice quién es un agente (y de qué humano responde), quién es un
// humano escribiendo directo, y qué nombres son destinos de difusión (equipo,
// todos…) en vez de una persona. Sin esto los tres se pintaban IGUAL — que es
// justo el hueco medido: en un canal mixto humano+IA, saber de quién es el
// agente que habla es la información que más falta.
async function cargarRoster() {
  try { ROSTER = await api("/roster"); }
  catch { ROSTER = { agentes: [], humanos: [], difusion: [] }; }
  DIFUSION = new Set((ROSTER.difusion || []).map(x => x.toLowerCase()));
  HUMANOS = new Set();
  for (const h of ROSTER.humanos || []) {
    if (h.nombre) HUMANOS.add(h.nombre.toLowerCase());
    (h.alias || []).forEach(a => HUMANOS.add(String(a).toLowerCase()));
  }
  AGENTE_HUMANO = new Map();
  for (const a of ROSTER.agentes || []) {
    if (a.nombre && a.humano) AGENTE_HUMANO.set(a.nombre.toLowerCase(), a.humano);
  }
}

function clasificar(nombre) {
  if (!nombre) return null;
  const n = nombre.toLowerCase();
  if (DIFUSION.has(n)) return "difusion";
  if (HUMANOS.has(n)) return "humano";
  if (AGENTE_HUMANO.has(n)) return "agente";
  return null;
}

// ── cursor de YO: solo lectura ──────────────────────────────────────────────
// GET /cursor no muta nada — es la misma tabla que consulta /inbox, servida como
// JSON. Esta página nunca llama al POST que la avanza: el separador refleja lo
// que otra cosa (la CLI, otro agente) ya marcó, no lo que esta pestaña decide.
async function cargarCursores() {
  if (!YO) { CURSORES = null; return; }
  try { CURSORES = await api(`/cursor/${encodeURIComponent(YO)}`); }
  catch { CURSORES = null; }
}

// La cabecera repite en prosa lo que ya sale arriba como marcas
// («[🔎📊qa · DIAGNÓSTICO…» cuando la línea de meta ya dice «qa →»). Enseñar dos
// veces lo mismo es lo que hace ilegible una lista de 23.000 ensayos.
//
// No se puede recortar hasta el `]` de cierre: en estas cabeceras el corchete abarca
// el ensayo entero y muchas no lo cierran nunca. Se pela por capas: corchete, emoji,
// la ETIQUETA de tipo si abre la cabecera («[HEARTBEAT actor]», la convención de los
// latidos — 39,8% del ledger mayor), el nombre del propio actor, la flecha con sus destinos,
// el corchete de cierre SUELTO cuando no hubo flecha que lo consumiera, y el sello.
//
// La etiqueta se mira UNA sola vez, aquí, en el mismo orden que ledger_parse.py del
// lado servidor — no se reintenta tras pelar el actor. Medido: una versión que
// reintentaba limpiaba unos pocos casos más (actor antes que la etiqueta, orden
// invertido), pero se comía "ACK"/"DONE"/"HANDOFF" cuando esas palabras eran texto
// libre genuino («✅ ACK tu reparto…», «🔬 handoff research…») en vez de la etiqueta
// del protocolo. Se prefiere el falso negativo (queda algo sin limpiar) al falso
// positivo (se pierde contenido real) — verificado contra 1.619 entradas reales de
// los 6 ledgers: 811 rotas → 207, CERO casos donde el resultado empeorase.
const ETIQUETAS = /^(HEARTBEAT|CARRY-FORWARD|CLAIM|CANON|CERT|DONE|RESP|AVISO|MSG|ASK|ACK|STATUS|INFO|HANDOFF)(?:[/·-]\s*(?:HEARTBEAT|CARRY-FORWARD|CLAIM|CANON|CERT|DONE|RESP|AVISO|MSG|ASK|ACK|STATUS|INFO|HANDOFF))*\b\s*/i;

function titular(cab, actor) {
  let t = (cab || "").replace(/^#{2,3}\s*/, "").replace(/^\[\s*/, "");
  // emoji y pictogramas de apertura (van como decoración, no como información)
  t = t.replace(/^[\p{Extended_Pictographic}\p{Emoji_Presentation}️‍\s]+/u, "");
  // la etiqueta de tipo que abre la cabecera en la convención `[TIPO actor]`
  t = t.replace(ETIQUETAS, "");
  // el actor otra vez, con su separador
  if (actor) {
    const esc = actor.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
    t = t.replace(new RegExp("^" + esc + "\\b\\s*[·:—–-]?\\s*", "i"), "");
  }
  // la flecha con sus destinatarios, hasta el cierre del corchete o un separador fuerte
  t = t.replace(/^(?:→|->)[^\]]{0,160}?\]\s*/, "");
  // el corchete de cierre SUELTO: cuando la cabecera era «[ETIQUETA actor]» sin
  // flecha (el caso HEARTBEAT), nada de lo anterior lo consumía y se colaba entero
  // —junto con el sello de tiempo que va justo detrás— al titular.
  t = t.replace(/^\]\s*/, "");
  // el sello de tiempo, que ya sale a la derecha
  t = t.replace(/^\d{4}-\d{2}-\d{2}T?[\d:]*Z?\s*[—–-]?\s*/, "");
  t = t.replace(/^[\p{Extended_Pictographic}️\s·—–-]+/u, "");
  return t.trim() || (cab || "").replace(/^#{2,3}\s*/, "").slice(0, 160);
}

// ── los tres estados vacíos ──────────────────────────────────────────────────
// "sin filas" no es UN estado: es tres, y confundirlos es justo el "verde sin su
// condición" que este proyecto lleva toda la sesión cazando. Sin ledgers
// configurados, con ledgers pero sin entradas, y con entradas pero sin resultados
// para ESTOS filtros piden explicaciones y acciones distintas.
function estadoVacio(motivo) {
  const c = el("div", "estado-vacio");
  if (motivo === "sin-ledgers") {
    c.append(el("h2", null, "No hay ningún ledger conectado"));
    c.append(el("p", null,
      "llminbox indexa ficheros markdown de solo-apéndice donde varios " +
      "agentes de IA coordinan escribiendo entradas (con `>>` o `POST /append`). " +
      "Hoy no está apuntado a ninguno."));
    const p2 = el("p");
    p2.append(document.createTextNode("Añade una ruta en "), el("code", null, "LLMINBOX_LEDGERS"),
              document.createTextNode(" y reinicia con "), el("code", null, "llmi up"),
              document.createTextNode("."));
    c.append(p2);
  } else if (motivo === "sin-entradas") {
    c.append(el("h2", null, "Ledger(s) conectados, todavía sin entradas"));
    c.append(el("p", null,
      "El servicio ve el fichero pero está vacío. Escribe la primera entrada — con " +
      "`>>` al markdown, o con `POST /append` — y aparece aquí sola en unos segundos: " +
      "el indexador sondea por su cuenta, no hace falta reiniciar nada."));
  } else {
    c.append(el("h2", null, "Nada con estos filtros"));
    c.append(el("p", null,
      "Hay entradas en este ledger, pero ninguna coincide con la búsqueda, el tipo " +
      "o «solo lo mío» que tienes activos ahora mismo."));
    const b = el("button", "secundario", "quitar filtros");
    b.type = "button";
    b.onclick = () => { $("#buscar").value = ""; $("#tipo").value = ""; $("#solomias").checked = false; cargar(); };
    c.append(b);
  }
  return c;
}

// Cuál de los tres aplica: mira el CANAL seleccionado (no el global — un canal
// vacío entre otros con datos NO es "filtro vacío", medido en vivo: seleccionar
// un ledger de 0 entradas con los filtros en blanco caía a "filtro-vacío" por
// mirar `EST` entero en vez del canal actual) y si hay algún filtro activo.
function motivoVacio() {
  if (LEDGERS_CONFIGURADOS === 0) return "sin-ledgers";
  const filtrosActivos = $("#buscar").value !== "" || $("#tipo").value !== "" || $("#solomias").checked;
  const relevantes = LEDGER ? EST.filter(x => x.ledger === LEDGER) : EST;
  const totalRelevante = relevantes.reduce((a, x) => a + x.entradas, 0);
  if (!filtrosActivos && totalRelevante === 0) return "sin-entradas";
  return "filtro-vacio";
}

function pintar(filas) {
  const f = $("#flujo");
  f.replaceChildren();
  if (!filas.length) {
    f.append(estadoVacio(motivoVacio()));
    return;
  }

  // Separador de no-leídos: compara CADA fila contra el cursor de SU PROPIO
  // ledger (arrival es un contador local por ledger, no comparable entre ellos).
  // Solo tiene sentido con un agente elegido en «leer como» y su cursor cargado.
  const activo = YO && CURSORES;
  const esNueva = r => activo && r.arrival > (CURSORES[r.ledger] ?? -1);
  const nuevas = activo ? filas.filter(esNueva).length : 0;
  const separador = n => {
    const b = el("div", "separador");
    txt(b, `${n} nueva${n === 1 ? "" : "s"} desde tu última visita`);
    return b;
  };
  // Si TODO lo cargado es nuevo no hay "antes" que contrastar dentro de esta
  // ventana: se avisa arriba en vez de partir la lista en medio de la nada.
  if (nuevas && nuevas === filas.length) f.append(separador(nuevas));

  let puesto = nuevas === filas.length;
  for (const r of filas) {
    if (!puesto && nuevas > 0 && !esNueva(r)) { f.append(separador(nuevas)); puesto = true; }

    const art = el("article");
    const destinos = r.to || [];
    if (YO && (r.actor === YO || destinos.includes(YO))) art.classList.add("mia");

    const meta = el("div", "meta");
    const q = el("span", "quien");
    q.append(punto(r.actor), document.createTextNode(r.actor || "?"));
    if (r.actor) q.style.color = `oklch(0.84 0.10 ${tono(r.actor)})`;
    meta.append(q);
    const kActor = clasificar(r.actor);
    if (kActor === "agente") {
      const h = AGENTE_HUMANO.get((r.actor || "").toLowerCase());
      if (h) meta.append(el("span", "por", `· gestionado por ${h}`));
    } else if (kActor === "humano") {
      meta.append(el("span", "etq-persona", "persona"));
    } else if (kActor === "difusion") {
      meta.append(el("span", "etq-difusion", "difusión"));
    }
    if (destinos.length) {
      meta.append(el("span", "flecha", "→"));
      const para = el("span", "para");
      destinos.forEach((d, i) => {
        if (i) para.append(document.createTextNode(" "));
        const n = el("b", "destino", d);
        // El destinatario lleva el MISMO tono que cuando es él quien habla: así se
        // sigue un hilo entre dos agentes de un vistazo, sin leer los nombres.
        if (clasificar(d) === "agente") n.style.color = `oklch(0.74 0.08 ${tono(d)})`;
        if (d === YO) n.classList.add("yo");
        const kd = clasificar(d);
        if (kd === "difusion") n.classList.add("difusion");
        else if (kd === "agente") {
          const h = AGENTE_HUMANO.get(d.toLowerCase());
          if (h) n.title = `gestionado por ${h}`;
        } else if (kd === "humano") {
          n.title = "persona";
        }
        para.append(n);
      });
      meta.append(para);
    }
    if (r.tipo) meta.append(el("span", "marca-tipo " + r.tipo, r.tipo));
    meta.append(el("span", "cuando", hora(r.ts)));
    art.append(meta);

    const h = el("p", "titular", titular(r.head, r.actor));
    h.title = "Pulsa para ver el cuerpo entero";
    h.onclick = () => art.classList.toggle("abierta");
    art.append(h);

    // `body` guarda la entrada ENTERA, cabecera incluida. Aquí la cabecera ya está
    // arriba (metadatos + titular), así que repetirla es ruido: se quita la 1ª línea.
    const soloCuerpo = (r.body || "").replace(/^#{2,3} \[[^\n]*\n?/, "").trim();
    const cuerpo = el("pre", "cuerpo", soloCuerpo || "(sin cuerpo)");
    // "ver más" sólo si de verdad hay más: un botón que no hace nada es ruido.
    const largo = soloCuerpo.split("\n").length > 3 || soloCuerpo.length > 260;
    if (largo) {
      cuerpo.classList.add("recortado");
      const mas = el("button", "vermas", "ver más");
      mas.onclick = () => {
        art.classList.toggle("abierta");
        mas.textContent = art.classList.contains("abierta") ? "ver menos" : "ver más";
      };
      art.append(cuerpo, mas);
    } else {
      art.append(cuerpo);
    }
    art.append(txt(el("div", "pie"), `${r.ledger} · llegada #${r.arrival} · línea ${r.line_no}`));
    f.append(art);
  }
}

async function cargar() {
  $("#flujo").replaceChildren(el("p", "cargando", "cargando…"));
  const filas = await api("/entries", {
    ledger: LEDGER, limit: 120, cuerpo: true,
    q: $("#buscar").value, tipo: $("#tipo").value,
    to: $("#solomias").checked && YO ? YO : "",
  });
  $("#cuenta").textContent = filas.length + (filas.length === 120 ? "+ entradas" : " entradas");
  pintar(filas);
}

// ── menú móvil ───────────────────────────────────────────────────────────────
function alternarMenu(abrir) {
  const a = $("#barra-lateral"), f = $("#fondo");
  const mostrar = abrir ?? !a.classList.contains("abierta");
  a.classList.toggle("abierta", mostrar);
  f.hidden = !mostrar;
  $("#togglemenu").setAttribute("aria-expanded", String(mostrar));
}

async function arrancar() {
  const salud = await api("/health");
  const est = await api("/stat");
  await cargarRoster();
  EST = est;
  LEDGERS_CONFIGURADOS = est.length;
  $("#barra-lateral").hidden = false; $("main").hidden = false; $("#puerta").remove();
  $("#togglemenu").hidden = false;
  $("#fondo").onclick = () => alternarMenu(false);
  $("#togglemenu").onclick = () => alternarMenu();
  document.addEventListener("keydown", e => { if (e.key === "Escape") alternarMenu(false); });

  const total = est.reduce((a, x) => a + x.entradas, 0);
  const idas = est.reduce((a, x) => a + (x.desaparecidas || 0), 0);
  $("#resumen").textContent = est.length
    ? `${total.toLocaleString("es")} entradas · ${est.length} ledgers`
    : "0 ledgers configurados";

  const cs = $("#canales");
  const hacer = (id, nombre, n) => {
    const b = el("button", "canal");
    b.append(el("span", "n", nombre), el("span", "c", n == null ? "" : n.toLocaleString("es")));
    b.onclick = () => {
      LEDGER = id;
      cs.querySelectorAll(".canal").forEach(x => x.setAttribute("aria-current", "false"));
      b.setAttribute("aria-current", "true");
      $("#titulo").textContent = nombre;
      alternarMenu(false);
      cargar();
    };
    cs.append(b);
    return b;
  };
  const todos = hacer("", "todos", total);
  est.forEach(x => hacer(x.ledger, x.ledger, x.entradas));
  todos.setAttribute("aria-current", "true");
  $("#titulo").textContent = "todos";

  // Un servicio degradado NO se calla: si el indexador falla o falta algo, se dice
  // arriba. Una lista que se ve normal mientras el índice está roto es el "verde sin
  // su condición" que este proyecto lleva toda la sesión cazando.
  if (!salud.ok || idas) {
    const a = el("div", "aviso");
    a.textContent = idas
      ? `⚠ ${idas} entrada(s) que estuvieron y ya no están. Un ledger de sólo-apéndice no pierde entradas: mira \`llmi verify\`.`
      : `⚠ El indexador no está al día (${salud.indexador?.error || "sin detalle"}). Lo que ves puede no reflejar el fichero.`;
    $("#alertas").append(a);
  }

  if (!est.length) {
    // Sin ledgers no hay filtros ni "leer como" que montar — se corta aquí y el
    // estado vacío A (dibujado por pintar/cargar más abajo) explica el resto.
    $("#buscar").disabled = true; $("#tipo").disabled = true; $("#solomias").disabled = true;
    pintar([]);
    return;
  }

  const muestra = await api("/entries", { limit: 400 });
  const tipos = [...new Set(muestra.map(x => x.tipo).filter(Boolean))].sort();
  tipos.forEach(t => $("#tipo").append(new Option(t, t)));
  AGENTES = [...new Set(muestra.flatMap(x => [x.actor, ...(x.to || [])]).filter(Boolean))].sort();
  $("#yo").append(new Option("— nadie —", ""));
  AGENTES.forEach(a => $("#yo").append(new Option(a, a)));
  $("#yo").value = YO;
  $("#yo").onchange = async e => {
    YO = e.target.value;
    localStorage.setItem("llminbox.yo", YO);
    await cargarCursores();
    cargar();
  };

  await cargarCursores();

  let t;
  $("#buscar").oninput = () => { clearTimeout(t); t = setTimeout(cargar, 260); };
  $("#tipo").onchange = cargar;
  $("#solomias").onchange = cargar;
  cargar();
}

if (TOKEN) {
  arrancar().catch(() => { localStorage.removeItem(CLAVE); location.reload(); });
} else {
  $("#puerta").style.display = "grid";
  $("#entrar").onsubmit = async e => {
    e.preventDefault();
    TOKEN = $("#token").value.trim();
    try {
      await api("/health");
      await api("/stat");                      // /health no pide token: se prueba uno que sí
      localStorage.setItem(CLAVE, TOKEN);
      arrancar();
    } catch { $("#errpuerta").textContent = "Ese token no vale."; }
  };
}
</script>
