name: Scale evidence

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, labeled]

permissions:
  contents: read

concurrency:
  group: scale-evidence-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  canonical:
    name: G10 · millón de entradas y 16 procesos
    if: github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'measure-scale')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.13" }
      - name: Comprobar capacidad del runner y guardar el sujeto
        run: |
          export EVIDENCE_DIR="$RUNNER_TEMP/faro-scale-evidence"
          printf 'EVIDENCE_DIR=%s\n' "$EVIDENCE_DIR" >> "$GITHUB_ENV"
          mkdir -p "$EVIDENCE_DIR"
          python3 - <<'PY'
          import json, os, pathlib, shutil, subprocess
          evidence = pathlib.Path(os.environ['EVIDENCE_DIR'])
          mem = dict(line.split(':', 1) for line in pathlib.Path('/proc/meminfo').read_text().splitlines())
          available = int(mem['MemAvailable'].split()[0]) * 1024
          free = shutil.disk_usage(evidence).free
          cores = os.cpu_count() or 1
          load = os.getloadavg()[0] / cores
          subject = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          blockers = []
          if available < 4 * 2**30: blockers.append('memoria disponible inferior a 4 GiB')
          if free < 8 * 2**30: blockers.append('disco libre inferior a 8 GiB')
          if load > 0.60: blockers.append('carga inicial por núcleo superior a 0.60')
          report = {'tested_commit': subject, 'available_memory_bytes': available,
                    'free_disk_bytes': free, 'cores': cores, 'load_per_core': load,
                    'blockers': blockers, 'product_qualification': False}
          evidence.joinpath('runner.json').write_text(json.dumps(report, indent=2) + '\n')
          print(json.dumps(report))
          if blockers: raise SystemExit(2)
          PY
      - name: Medir el corpus canónico, la concurrencia y el replay del proyector
        run: |
          set +e
          timeout --signal=TERM --kill-after=15s 20m \
            python3 bench/scale_envelope_bench.py \
              --filas 1000000 --agentes 16 --repeticiones 40 \
              --db "$EVIDENCE_DIR/corpus.sqlite" \
              --salida "$EVIDENCE_DIR/result.json" \
              > "$EVIDENCE_DIR/benchmark.log" 2>&1
          result=$?
          printf '%s\n' "$result" > "$EVIDENCE_DIR/exit-code.txt"
          cat "$EVIDENCE_DIR/benchmark.log"
          exit "$result"
      - name: Conservar medidas y diagnóstico sin bases ni credenciales
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: scale-evidence-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ env.EVIDENCE_DIR }}/runner.json
            ${{ env.EVIDENCE_DIR }}/result.json
            ${{ env.EVIDENCE_DIR }}/exit-code.txt
            ${{ env.EVIDENCE_DIR }}/benchmark.log
          if-no-files-found: error
          retention-days: 14
